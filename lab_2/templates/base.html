<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Онлайн-кинотеатр{% endblock %} | МИЭТ СПИНТех</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">
            <a href="{{ url_for('index') }}">🎬 Кино<span>Сфера</span> <span class="badge">ПИН-35</span></a>
        </div>
        <div class="nav-links">
            <a href="{{ url_for('index') }}">Каталог фильмов</a>
            <a href="{{ url_for('watch_room', room_code='ROOM-359') }}">Комната ROOM-359</a>
            <a href="{{ url_for('profile') }}">Профиль: <b>{{ user.username.split()[0] }}</b></a>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
