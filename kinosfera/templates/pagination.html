{% if pagination and pagination.pages > 1 %}
<nav class="pagination" aria-label="Страницы списка">
{% if pagination.previous %}<a href="{{ pagination.previous }}" rel="prev" aria-label="Предыдущая страница">←</a>{% endif %}
{% for item in pagination.links %}{% if item %}<a href="{{ item.url }}" class="{{ 'active' if item.number == pagination.page }}" {% if item.number == pagination.page %}aria-current="page"{% endif %}>{{ item.number }}</a>{% else %}<span>…</span>{% endif %}{% endfor %}
{% if pagination.next %}<a href="{{ pagination.next }}" rel="next" aria-label="Следующая страница">→</a>{% endif %}
<span class="muted">Всего: {{ pagination.total }}</span>
</nav>
{% endif %}
